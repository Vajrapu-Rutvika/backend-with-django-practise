<!DOCTYPE html>
<html>
<head>
    <title>Blog Posts</title>
</head>
<body>
    <h1>Blog Posts</h1>
    <ul>
        {% for post in posts %}
            <li>
                <strong>{{ post.title }}</strong> <br>
                {{ post.content }} <br>
                Views: {{ post.views }} <br>
                Published: {{ post.published }} <br>
                Created at: {{ post.created_at }} <br>
            </li>
            {% empty %}
            <li>No posts available.</li>
        {% endfor %}
        
    </ul>
</body>
</html>
